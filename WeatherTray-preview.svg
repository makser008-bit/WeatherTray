<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Weather Tray on the Windows 11 taskbar</title>
  <desc id="desc">Illustrative preview of a weather widget beside the Windows 11 system tray, with a weather tooltip above it.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14233f"/>
      <stop offset="0.55" stop-color="#213b69"/>
      <stop offset="1" stop-color="#111b32"/>
    </linearGradient>
    <radialGradient id="glow" cx="55%" cy="42%" r="70%">
      <stop offset="0" stop-color="#77b9ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#77b9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="taskbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f8ff" stop-opacity=".83"/>
      <stop offset="1" stop-color="#dce5f3" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252a35"/>
      <stop offset="1" stop-color="#191d26"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020817" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>

  <!-- Desktop wallpaper -->
  <rect width="1280" height="760" fill="url(#wall)"/>
  <rect width="1280" height="760" fill="url(#glow)"/>
  <ellipse cx="460" cy="360" rx="430" ry="210" fill="#68aaf7" opacity=".13" filter="url(#soft)"/>
  <path d="M-70 560C140 420 340 440 500 560s330 140 520 18 300-124 430-46v250H-70Z" fill="#0c152a" opacity=".37"/>
  <path d="M-80 600c220-112 380-62 520 24s280 86 440-6 290-106 480-34v176H-80Z" fill="#080f20" opacity=".25"/>

  <!-- Weather tooltip -->
  <g filter="url(#shadow)">
    <rect x="855" y="315" width="350" height="294" rx="18" fill="url(#tip)" stroke="#737b88" stroke-opacity=".48"/>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#f4f6fa">
    <text x="883" y="354" font-size="14" fill="#c2c8d3">ПОГОДА ЗАРАЗ</text>
    <text x="883" y="408" font-size="40" font-weight="600">12°</text>
    <text x="977" y="407" font-size="18">Хмарно</text>
    <text x="883" y="439" font-size="15" fill="#c2c8d3">Місто для прикладу</text>
    <path d="M883 461h294" stroke="#68717e" stroke-opacity=".45"/>
    <text x="883" y="493" font-size="15" fill="#e4e8ef">Відчувається як 11°</text>
    <text x="883" y="525" font-size="15" fill="#e4e8ef">Вітер: 2,1 м/с</text>
    <text x="883" y="557" font-size="15" fill="#e4e8ef">Вологість: 62%</text>
  </g>

  <!-- Taskbar -->
  <rect x="0" y="666" width="1280" height="94" fill="url(#taskbar)"/>
  <rect x="0" y="666" width="1280" height="1" fill="#ffffff" opacity=".75"/>

  <!-- Centered app icons -->
  <g transform="translate(493 687)">
    <rect width="38" height="38" rx="10" fill="#ffffff" opacity=".46"/>
    <path d="M9 11h9v8H9zm11 0h9v8h-9zM9 21h9v8H9zm11 0h9v8h-9z" fill="#1683d8"/>
  </g>
  <g transform="translate(545 687)">
    <rect width="38" height="38" rx="10" fill="#ffffff" opacity=".46"/>
    <circle cx="19" cy="19" r="11" fill="#f5c542"/>
    <path d="M19 8v22M8 19h22M11 11l16 16m0-16L11 27" stroke="#e79b27" stroke-width="2"/>
  </g>
  <g transform="translate(597 687)">
    <rect width="38" height="38" rx="10" fill="#ffffff" opacity=".46"/>
    <path d="M9 10h20v18H9z" fill="#e8eef7" stroke="#6c7b90"/>
    <path d="M9 14h20" stroke="#6c7b90"/>
    <circle cx="13" cy="12" r="1" fill="#e36c6c"/>
  </g>
  <g transform="translate(649 687)">
    <rect width="38" height="38" rx="10" fill="#ffffff" opacity=".46"/>
    <circle cx="19" cy="19" r="11" fill="#f7f8fb" stroke="#7d8ca0"/>
    <path d="M19 12v8l6 4" fill="none" stroke="#4787d7" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(701 687)">
    <rect width="38" height="38" rx="10" fill="#ffffff" opacity=".46"/>
    <path d="M11 25 19 11l8 14z" fill="#ea6a58"/>
    <path d="M14 25h14" stroke="#e6a43d" stroke-width="3"/>
  </g>

  <!-- Weather Tray widget immediately left of the system tray -->
  <g font-family="Segoe UI, Arial, sans-serif" fill="#273243">
    <g transform="translate(1015 687)">
      <circle cx="12" cy="11" r="5" fill="#f0b849"/>
      <path d="M9 28h17a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0 0 12Z" fill="#f7fbff" stroke="#66778e" stroke-width="1.5"/>
      <text x="35" y="25" font-size="17" font-weight="600">12°</text>
    </g>
    <text x="1113" y="706" font-size="15" fill="#344154">⌃</text>
    <path d="M1141 700q8-9 16 0m-13 4q5-5 10 0m-5 4h.1" fill="none" stroke="#344154" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M1171 695v15h15v-15m-11-4h7v4h-7z" fill="none" stroke="#344154" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="1200" y="701" font-size="13" text-anchor="middle">09:41</text>
    <text x="1200" y="719" font-size="11" text-anchor="middle" fill="#48566b">23.11</text>
  </g>

  <!-- Small callout -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="928" y="624" width="191" height="25" rx="12.5" fill="#17243b" opacity=".83"/>
    <text x="1023.5" y="641" fill="#edf4ff" text-anchor="middle" font-size="12">Weather Tray · віджет погоди</text>
  </g>
</svg>

